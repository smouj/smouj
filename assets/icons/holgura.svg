<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cleaner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- four-point sparkle -->
  <path d="M256 96c10 62 42 94 104 104-62 10-94 42-104 104-10-62-42-94-104-104 62-10 94-42 104-104z"
        fill="url(#spark)"/>

  <!-- small companion sparkle -->
  <path d="M372 300c5 30 20 45 50 50-30 5-45 20-50 50-5-30-20-45-50-50 30-5 45-20 50-50z"
        fill="#FFFFFF" opacity="0.72"/>

  <!-- cleaned particles -->
  <circle cx="152" cy="344" r="16" fill="#FFFFFF" opacity="0.34"/>
  <circle cx="208" cy="392" r="10" fill="#FFFFFF" opacity="0.22"/>
</svg>
